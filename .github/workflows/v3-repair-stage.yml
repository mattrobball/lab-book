name: V3 exact patch objects (temporary)
on:
  push:
    branches: ['repair/v3-review-fixes-20260922']
    paths: ['maintenance/v3-release.patch']
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply reviewed patch and upload verified blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          assert os.environ['GITHUB_REPOSITORY'] == 'mattrobball/lab-book'
          patch = pathlib.Path('maintenance/v3-release.patch').read_bytes()
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          expected = {
            '.claude-plugin/marketplace.json': '85eb87e3f3b0788acd862c0ae7569dd0d6153c3e',
            '.claude-plugin/plugin.json': '30f8a5ad362bfeca1623651f2a62ec9ff55ffe18',
            '.github/workflows/kit-tests.yml': '820e2dbf769876acb89e8c33b37c868845e06b42',
            '.github/workflows/v3-pilot.yml': '563fb9432aae6e36e19d1969f0960909a044722c',
            '.github/workflows/v3-jev-sdk.yml': '99e3f20e4825a974e35c16ba22203cc7f1df4410',
            'skills/open-lab/SKILL.md': '86809a352272cf2891269ee42c54fde9adc288b0',
            'skills/open-lab/assets/v3/replay.py': 'c31bb45ad1ec90340998fcac34f14ff9e6f23293',
            'skills/open-lab/scripts/tests/test_replay_isolation.py': '8f91d35fa53082dca8cfd5a616cff55f51286570'
          }
          paths = subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert set(paths) == set(expected)
          manifest = []
          for path in paths:
              data=pathlib.Path(path).read_bytes()
              digest=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert digest == expected[path], (path,digest)
              body=json.dumps({'encoding':'base64','content':base64.b64encode(data).decode()}).encode()
              req=urllib.request.Request('https://api.github.com/repos/mattrobball/lab-book/git/blobs',data=body,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as response: result=json.load(response)
              assert result['sha']==digest
              mode=subprocess.check_output(['git','ls-files','--stage','--',path],text=True).split()[0]
              manifest.append({'path':path,'mode':mode,'type':'blob','sha':digest})
          pathlib.Path('evidence/blob-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          pathlib.Path('evidence/source.sha').write_text(os.environ['GITHUB_SHA']+'\n')
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          with open('evidence/source.tar','wb') as f: subprocess.run(['git','archive',tree],stdout=f,check=True)
          print(json.dumps({'uploaded_blobs':len(manifest),'branch_updates':0,'patched_tree':tree}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-objects-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
