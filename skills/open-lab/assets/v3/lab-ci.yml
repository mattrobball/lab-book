# Copy to .github/workflows/lab-ci.yml in a LAB repository, not just the kit.
name: Lab v3
on:
  push:
    branches: ['main', 'lab/**']
permissions:
  contents: write
  issues: write
concurrency:
  group: lab-v3-${{ github.ref }}
  cancel-in-progress: false
jobs:
  board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          git config user.name 'lab-book CI'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          python board.py --root . --output site --check --before "$BEFORE"
          python - <<'PY'
          import pathlib, re, subprocess
          import claims, run
          root = pathlib.Path.cwd()
          for problem in run.all_problems(root):
              claims.regenerate(problem)
              run.regenerate_index(problem)
          tracked = subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()
          fresh = subprocess.check_output(['git','ls-files','--others','--exclude-standard'], text=True).splitlines()
          allowed = re.compile(r'^problems/[^/]+/(?:CLAIMS\.md|notebook/INDEX\.md|claims/(?:C-[a-z0-9-]+\.md|rectification-automation-ci\.jsonl))$')
          paths = [p for p in tracked + fresh if allowed.fullmatch(p)]
          if any(not allowed.fullmatch(p) for p in tracked):
              raise SystemExit('unexpected tracked write; refusing publication')
          if paths:
              subprocess.run(['git','add','--',*paths], check=True)
              subprocess.run(['git','commit','-m','CI: comparison metadata and derived views'], check=True)
          PY
          # A concurrent source push makes this fail rather than overwrite it.
          git push origin "HEAD:$BRANCH"
          python board.py --root . --output site --sync-issues
        env:
          BEFORE: ${{ github.event.before }}
          BRANCH: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-lab-board
          path: site/
          if-no-files-found: error
          retention-days: 14
