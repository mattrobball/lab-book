name: Kit tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record source identity
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/source.sha
          git archive HEAD | gzip > evidence/source.tar.gz
          sha256sum evidence/source.tar.gz > evidence/source.sha256
          python --version > evidence/python.txt
          git --version > evidence/git.txt
      - name: Regression suite
        run: |
          printf '%s\n' 'python -m unittest discover -s skills/open-lab/scripts/tests -v' > evidence/command.txt
          set +e
          python -m unittest discover -s skills/open-lab/scripts/tests -v > evidence/tests.stdout 2> evidence/tests.stderr
          result=$?
          printf '%s\n' "$result" > evidence/tests.exit
          cat evidence/tests.stdout
          cat evidence/tests.stderr
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kit-evidence-${{ github.sha }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
