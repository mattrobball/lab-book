name: V3 integration objects
on:
  push:
    branches: ['implementation/v3-minimal-20260922']
    paths: ['.github/workflows/v3-objects.yml']
permissions:
  contents: write
jobs:
  objects:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build exact reviewed objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, py_compile, runpy, subprocess, urllib.request
          p = pathlib.Path('.github/v3_patch.py')
          text = p.read_text()
          # Preserve the escaped newline in the generated Python source.
          assert chr(92)*2+'nReservations' not in text
          text = text.replace(chr(92)+'nReservations', chr(92)*2+'nReservations')
          p.write_text(text)
          runpy.run_path(str(p))
          expected = {
            'skills/open-lab/scripts/claims.py': '63ccc69ef46d65b21aae48f7e4e5dab634ea35fc',
            'skills/open-lab/scripts/run.py': '8af53795c6c0c7ad5f7102371840c9f0a967ae30',
            'skills/open-lab/scripts/tests/test_run.py': 'e217918725f4cc0a1b50051be319025f7280d274',
            'skills/open-lab/scripts/tests/test_federation.py': 'ef3c0858cb2a31bb7fe6b9803c0efb34a04b2bb2',
            'skills/open-lab/scripts/rectification.py': '703165373d09b207453eb09ebf51ccc916497d38',
            'skills/open-lab/SKILL.md': '11ca4900fa7cd2bf2ea2a3392fe0cf1fc0f5607b',
            '.claude-plugin/plugin.json': '0424d6253ef5d6bce657f511a0dd6cacd3f3d39f',
            '.claude-plugin/marketplace.json': '19e344d0e12c3440edd0797f402fa4b2e84700e1',
            'DESIGN_V3.md': 'fed7d858a088b56130d52581ad10a1a672287bc4',
            'DESIGN_QUEUE.md': 'fe90b932b62b5a60fa65e599555ea807d6cadf11',
            'README.md': 'ab370071f5cbaeb590773d16e45911a51365d1ec',
            'skills/open-lab/scripts/board.py': '4006fb18d2d63cc5cd5f0ffe4dafcc74821fb986',
            'skills/open-lab/scripts/reservations.py': '399eab2f23285616d4be54c622baa2c635c82b7b',
            'skills/open-lab/scripts/tests/test_v3.py': 'f4405ead77d0ddc6aa91b2cd23fe3ad4d972be41',
            'skills/open-lab/scripts/tests/test_v3_postgres.py': '8453e66c402e17b34a4ad9d675b480eaac2cf296',
            'skills/open-lab/assets/v3/reservations.sql': '6d910018a347e903f40f84b98bf8bc04578f2abc'
          }
          for name, sha in expected.items():
              data = pathlib.Path(name).read_bytes()
              actual = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert actual == sha, (name, actual, sha)
              if name.endswith('.py'):
                  py_compile.compile(name, doraise=True)
          out = pathlib.Path('object-evidence'); out.mkdir()
          (out/'source.sha').write_text(subprocess.check_output(['git','rev-parse','HEAD'], text=True))
          mapping = {}
          for name, sha in expected.items():
              payload = json.dumps({'content':pathlib.Path(name).read_text(),'encoding':'utf-8'}).encode()
              request = urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs', data=payload,
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
              assert result['sha'] == sha, (name, result)
              mapping[name] = sha
          (out/'objects.json').write_text(json.dumps(mapping,indent=2)+'\n')
          print(json.dumps(mapping,indent=2))
          print('Uploaded reviewed blobs only. No commit or branch ref was written by this job.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-integration-objects
          path: object-evidence/
          if-no-files-found: error
          retention-days: 7
