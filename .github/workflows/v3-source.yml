name: V3 source snapshot
on:
  push:
    branches: ['implementation/v3-minimal-20260922']
    paths: ['.github/workflows/v3-source.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          mkdir snapshot
          git archive HEAD | gzip > snapshot/source.tar.gz
          git rev-parse HEAD > snapshot/source.sha
          sha256sum snapshot/source.tar.gz > snapshot/source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: v3-source
          path: snapshot/
          retention-days: 7
