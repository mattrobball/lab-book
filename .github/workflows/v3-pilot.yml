name: V3 native pilot
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native fixture tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx postgresql-client
          bash skills/open-lab/integration/prepare-linux-replay.sh
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          mkdir -p "$RUNNER_TEMP/pilot-bin"
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/postgrest.tar.xz" https://github.com/PostgREST/postgrest/releases/download/v16.3/postgrest-v16.3-linux-static-x86-64.tar.xz
          echo "4eb414eb948c8800863cc8c9896a17b611b2dccf9ff581f4d57f42ec9ccee40d  $RUNNER_TEMP/postgrest.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/postgrest.tar.xz" -C "$RUNNER_TEMP/pilot-bin"
      - name: Retain source identity
        run: |
          mkdir -p "$RUNNER_TEMP/pilot-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/pilot-evidence/source.sha"
          git archive HEAD | gzip > "$RUNNER_TEMP/pilot-evidence/source.tar.gz"
          sha256sum "$RUNNER_TEMP/pilot-evidence/source.tar.gz" > "$RUNNER_TEMP/pilot-evidence/source.sha256"
          "$RUNNER_TEMP/pilot-bin/postgrest" --version > "$RUNNER_TEMP/pilot-evidence/postgrest-version.txt"
          python --version > "$RUNNER_TEMP/pilot-evidence/python.txt"
      - name: Two-investigator native loop
        env:
          LAB_BOOK_PILOT_EVIDENCE: ${{ runner.temp }}/pilot-evidence
          POSTGREST_BIN: ${{ runner.temp }}/pilot-bin/postgrest
        run: |
          set +e
          printf '%s\n' 'python skills/open-lab/integration/pilot.py -v' > "$LAB_BOOK_PILOT_EVIDENCE/command.txt"
          python skills/open-lab/integration/pilot.py -v > "$LAB_BOOK_PILOT_EVIDENCE/stdout" 2> "$LAB_BOOK_PILOT_EVIDENCE/stderr"
          result=$?
          printf '%s\n' "$result" > "$LAB_BOOK_PILOT_EVIDENCE/exit"
          cat "$LAB_BOOK_PILOT_EVIDENCE/stdout" "$LAB_BOOK_PILOT_EVIDENCE/stderr"
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-pilot-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pilot-evidence/
          if-no-files-found: error
          retention-days: 30
